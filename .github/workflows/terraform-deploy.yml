name: Healthcare EKS Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:

  deploy:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment: ${{ inputs.environment }}

    env:
      AWS_ACCOUNT_ID: "245758552830"
      AWS_REGION: "eu-west-2"
      CLUSTER_NAME: "eks-infra-prod"
      NAMESPACE: "healthcare"
      GTC_INFRA_PATH: "gtc-infrastructure"

    steps:

      # ==================================================
      # CHECKOUT APPLICATION REPOSITORY
      # ==================================================

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: healthcare-app


      # ==================================================
      # CHECKOUT EKS INFRASTRUCTURE REPOSITORY
      # ==================================================

      - name: Checkout EKS infrastructure
        uses: actions/checkout@v4
        with:
          repository: Theodora2024/gtc-infrastructure
          ref: theodora-eks-tf-deploy
          path: gtc-infrastructure
          token: ${{ secrets.GTC_INFRA_TOKEN || github.token }}


      # ==================================================
      # AWS OIDC AUTHENTICATION
      # ==================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::245758552830:role/HealthcareGitHubActionsEKSDeployRole
          aws-region: eu-west-2
          role-session-name: HealthcareEKSDeployment


      # ==================================================
      # IMAGE TAG
      # ==================================================

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"


      # ==================================================
      # ECR LOGIN
      # ==================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # BUILD BACKEND
      # ==================================================

      - name: Build Backend Image
        run: |
          docker build \
            -t healthcare-backend:${GITHUB_SHA} \
            ./healthcare-app/backend


      # ==================================================
      # BUILD FRONTEND
      # ==================================================

      - name: Build Frontend Image
        run: |
          docker build \
            -t healthcare-frontend:${GITHUB_SHA} \
            ./healthcare-app/frontend


      # ==================================================
      # TAG BACKEND
      # ==================================================

      - name: Tag Backend Image
        run: |
          docker tag \
            healthcare-backend:${GITHUB_SHA} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthcare-prod-backend:${IMAGE_TAG}


      # ==================================================
      # TAG FRONTEND
      # ==================================================

      - name: Tag Frontend Image
        run: |
          docker tag \
            healthcare-frontend:${GITHUB_SHA} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthcare-prod-frontend:${IMAGE_TAG}


      # ==================================================
      # PUSH BACKEND
      # ==================================================

      - name: Push Backend Image
        run: |
          docker push \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthcare-prod-backend:${IMAGE_TAG}


      # ==================================================
      # PUSH FRONTEND
      # ==================================================

      - name: Push Frontend Image
        run: |
          docker push \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthcare-prod-frontend:${IMAGE_TAG}


      # ==================================================
      # VERIFY EKS
      # ==================================================

      - name: Verify EKS Cluster
        run: |
          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output table


      # ==================================================
      # GIVE GITHUB ACTIONS ROLE EKS ACCESS
      # ==================================================

      - name: Ensure GitHub Actions EKS access
        env:
          PRINCIPAL_ARN: arn:aws:iam::245758552830:role/HealthcareGitHubActionsEKSDeployRole
          POLICY_ARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
        run: |

          if aws eks describe-access-entry \
            --cluster-name "$CLUSTER_NAME" \
            --principal-arn "$PRINCIPAL_ARN" \
            --region "$AWS_REGION" >/dev/null 2>&1
          then
            echo "EKS access entry already exists."
          else
            echo "Creating EKS access entry..."

            aws eks create-access-entry \
              --cluster-name "$CLUSTER_NAME" \
              --principal-arn "$PRINCIPAL_ARN" \
              --type STANDARD \
              --region "$AWS_REGION"

            echo "Waiting for access entry..."
            sleep 10
          fi

          POLICY_EXISTS=$(aws eks list-associated-access-policies \
            --cluster-name "$CLUSTER_NAME" \
            --principal-arn "$PRINCIPAL_ARN" \
            --region "$AWS_REGION" \
            --query "associatedAccessPolicies[?policyArn=='${POLICY_ARN}'].policyArn" \
            --output text)

          if [ -z "$POLICY_EXISTS" ]; then

            echo "Associating cluster-admin policy..."

            aws eks associate-access-policy \
              --cluster-name "$CLUSTER_NAME" \
              --principal-arn "$PRINCIPAL_ARN" \
              --policy-arn "$POLICY_ARN" \
              --access-scope type=cluster \
              --region "$AWS_REGION"

          else

            echo "Cluster-admin policy already associated."

          fi


      # ==================================================
      # CONFIGURE KUBECTL
      # ==================================================

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # ==================================================
      # VERIFY KUBERNETES ACCESS
      # ==================================================

      - name: Verify Kubernetes Access
        run: |
          kubectl get nodes
          kubectl get namespaces


      # ==================================================
      # SETUP TERRAFORM
      # ==================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==================================================
      # TERRAFORM INIT
      # ==================================================

      - name: Terraform Init
        working-directory: gtc-infrastructure/workspaces/eks
        run: |
          terraform init -reconfigure


      # ==================================================
      # TERRAFORM VALIDATE
      # ==================================================

      - name: Terraform Validate
        working-directory: gtc-infrastructure/workspaces/eks
        run: |
          terraform validate


      # ==================================================
      # TERRAFORM PLAN
      # ==================================================

      - name: Terraform Plan
        working-directory: gtc-infrastructure/workspaces/eks
        env:
          TF_VAR_backend_image: "245758552830.dkr.ecr.eu-west-2.amazonaws.com/healthcare-prod-backend:${{ env.IMAGE_TAG }}"
          TF_VAR_frontend_image: "245758552830.dkr.ecr.eu-west-2.amazonaws.com/healthcare-prod-frontend:${{ env.IMAGE_TAG }}"
        run: |
          terraform plan \
            -lock-timeout=5m \
            -input=false \
            -no-color \
            -var-file="values.tfvars" \
            -out=tfplan


      # ==================================================
      # TERRAFORM APPLY
      # ==================================================

      - name: Terraform Apply
        working-directory: gtc-infrastructure/workspaces/eks
        env:
          TF_VAR_backend_image: "245758552830.dkr.ecr.eu-west-2.amazonaws.com/healthcare-prod-backend:${{ env.IMAGE_TAG }}"
          TF_VAR_frontend_image: "245758552830.dkr.ecr.eu-west-2.amazonaws.com/healthcare-prod-frontend:${{ env.IMAGE_TAG }}"
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            tfplan


      # ==================================================
      # VERIFY BACKEND ROLLOUT
      # ==================================================

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            -n "$NAMESPACE" \
            --timeout=10m


      # ==================================================
      # VERIFY FRONTEND ROLLOUT
      # ==================================================

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status \
            deployment/frontend \
            -n "$NAMESPACE" \
            --timeout=10m


      # ==================================================
      # VERIFY HEALTHCARE APPLICATION
      # ==================================================

      - name: Verify Healthcare Workloads
        run: |
          echo "=== PODS ==="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "=== SERVICES ==="
          kubectl get services -n "$NAMESPACE"

          echo "=== INGRESS ==="
          kubectl get ingress -n "$NAMESPACE"

          echo "=== DEPLOYMENTS ==="
          kubectl get deployments -n "$NAMESPACE"

          echo "Healthcare EKS deployment completed successfully."