name: Reusable Terraform Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      backend_config:
        required: true
        type: string

      tfvars_file:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      AWS_ACCOUNT_ID: "245758552830"

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="${{ inputs.backend_config }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
        run: terraform plan -lock-timeout=30s -input=false -no-color -var-file="${{ inputs.tfvars_file }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
        run: terraform apply -auto-approve -input=false -var-file="${{ inputs.tfvars_file }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image
        working-directory: .
        run: docker build -t healthcare-backend:${{ github.sha }} -t healthcare-backend:latest ./backend

      - name: Build Frontend Image
        working-directory: .
        run: docker build -t healthcare-frontend:${{ github.sha }} -t healthcare-frontend:latest ./frontend

      - name: Set Image Tag
        working-directory: .
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Tag Backend Image
        working-directory: .
        run: |
          docker tag healthcare-backend:${{ github.sha }} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-backend:${IMAGE_TAG}

          docker tag healthcare-backend:${{ github.sha }} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-backend:latest

      - name: Tag Frontend Image
        working-directory: .
        run: |
          docker tag healthcare-frontend:${{ github.sha }} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-frontend:${IMAGE_TAG}

          docker tag healthcare-frontend:${{ github.sha }} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-frontend:latest

      - name: Push Backend Image
        working-directory: .
        run: |
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-backend:${IMAGE_TAG}
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-backend:latest

      - name: Push Frontend Image
        working-directory: .
        run: |
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-frontend:${IMAGE_TAG}
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/healthcare-${{ inputs.environment }}-frontend:latest

      - name: Deploy Backend
        working-directory: .
        run: |
          aws ecs update-service \
            --cluster healthcare-${{ inputs.environment }} \
            --service healthcare-backend \
            --force-new-deployment

      - name: Deploy Frontend
        working-directory: .
        run: |
          aws ecs update-service \
            --cluster healthcare-${{ inputs.environment }} \
            --service healthcare-frontend \
            --force-new-deployment

      - name: Wait for Backend
        working-directory: .
        run: |
          aws ecs wait services-stable \
            --cluster healthcare-${{ inputs.environment }} \
            --services healthcare-backend

      - name: Wait for Frontend
        working-directory: .
        run: |
          aws ecs wait services-stable \
            --cluster healthcare-${{ inputs.environment }} \
            --services healthcare-frontend
