
name: Frontend CI

on:

  push:
    branches:
      - main
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Packages
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Docker Build
        run: docker build -t healthcare-frontend .