

services:

  db:

    image: postgres:16

    container_name: healthcare-db

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:

    build: .

    container_name: healthcare-app

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "5000:5000"

    restart: unless-stopped

volumes:

  postgres_data:    