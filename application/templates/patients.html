{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">

        <div>

            <h2>Patients</h2>

            <p class="text-muted">
                Manage all registered patients.
            </p>

        </div>

        <button class="btn btn-primary">

            <i class="bi bi-person-plus-fill"></i>

            Add Patient

        </button>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">

                    <input
                        class="form-control"
                        placeholder="Search patient...">

                </div>

            </div>

            <table class="table table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>001</td>

                        <td>John Doe</td>

                        <td>Male</td>

                        <td>42</td>

                        <td>08031234567</td>

                        <td>

                            <span class="badge bg-success">
                                Stable
                            </span>

                        </td>

                        <td>

                            <button class="btn btn-sm btn-outline-primary">
                                View
                            </button>

                            <button class="btn btn-sm btn-outline-warning">
                                Edit
                            </button>

                            <button class="btn btn-sm btn-outline-danger">
                                Delete
                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>002</td>

                        <td>Mary James</td>

                        <td>Female</td>

                        <td>35</td>

                        <td>08087654321</td>

                        <td>

                            <span class="badge bg-warning">
                                Observation
                            </span>

                        </td>

                        <td>

                            <button class="btn btn-sm btn-outline-primary">
                                View
                            </button>

                            <button class="btn btn-sm btn-outline-warning">
                                Edit
                            </button>

                            <button class="btn btn-sm btn-outline-danger">
                                Delete
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
